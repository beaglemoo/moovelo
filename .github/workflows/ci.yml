name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/check-config-surface.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:16-3.5
        env:
          POSTGRES_USER: bikegps
          POSTGRES_PASSWORD: bikegps
          POSTGRES_DB: bikegps
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bikegps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The guard script is typed like everything else but lives outside the
      # backend package, so `mypy app` never saw it and a strict-mode
      # regression in it reached main. Named explicitly rather than moved:
      # it must stay importable by plain python3 with no venv, which is what
      # lets the config-surface job run before any dependency is installed.
      - run: uv run mypy app ../deploy/check-config-surface.py
      - name: pytest (fails if the DB tests were skipped)
        shell: bash
        run: uv run pytest -q -rs | tee /tmp/pytest.out
      - name: assert no skipped DB tests
        run: "! grep -q 'test postgres not reachable' /tmp/pytest.out"

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      # The refresh script's --dry-run is its test surface (a real run wipes a
      # volume and rebuilds routing tiles for ~30 min). Assert it emits the
      # destructive steps in the one safe order: stop -> remove container ->
      # wipe volume -> up -> wait healthy -> reindex -> smoke.
      - name: refresh-data --dry-run ordering
        shell: bash
        run: |
          out=$(bash scripts/refresh-data.sh --dry-run --profile prod)
          echo "$out"
          # `|| true`: GitHub runs `bash -eo pipefail`, so a grep miss would
          # otherwise abort the step before the friendly "missing step" report.
          ln() { printf '%s\n' "$out" | grep -nF "$1" | head -1 | cut -d: -f1 || true; }
          stop=$(ln 'stop valhalla')
          remove=$(ln 'rm -f valhalla')
          vol=$(ln 'docker volume rm')
          up=$(ln 'up -d')
          health=$(ln 'health == healthy')
          idx=$(ln 'run --rm indexer')
          smoke=$(ln 'exec -T valhalla curl')
          for step in stop remove vol up health idx smoke; do
            [ -n "${!step}" ] || { echo "missing step: $step"; exit 1; }
          done
          [ "$stop" -lt "$remove" ] && [ "$remove" -lt "$vol" ] \
            && [ "$vol" -lt "$up" ] && [ "$up" -lt "$health" ] \
            && [ "$health" -lt "$idx" ] && [ "$idx" -lt "$smoke" ] \
            || { echo "refresh steps out of order"; exit 1; }
          echo "refresh-data ordering OK"
