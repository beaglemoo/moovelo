name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:16-3.5
        env:
          POSTGRES_USER: bikegps
          POSTGRES_PASSWORD: bikegps
          POSTGRES_DB: bikegps
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bikegps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: pytest (fails if the DB tests were skipped)
        shell: bash
        run: uv run pytest -q -rs | tee /tmp/pytest.out
      - name: assert no skipped DB tests
        run: "! grep -q 'test postgres not reachable' /tmp/pytest.out"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
