name: moovelo

services:
  postgres:
    image: ghcr.io/baosystems/postgis:16-3.5
    environment:
      POSTGRES_DB: bikegps
      POSTGRES_USER: bikegps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikegps}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost-only, used by the backend test suite.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikegps -d bikegps"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/europe/united-kingdom/england-latest.osm.pbf}
      build_elevation: ${VALHALLA_BUILD_ELEVATION:-True}
      server_threads: ${VALHALLA_SERVER_THREADS:-}
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
    volumes:
      - valhalla_tiles:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    restart: unless-stopped

  # Parses the OSM extract Valhalla already downloaded into the place
  # index. Opt-in, and runs to completion rather than staying up:
  #   docker compose --profile index run --rm indexer
  # Until it has run, the app hides search, POIs and the cycle overlay.
  indexer:
    profiles: ["index"]
    build:
      context: .
      dockerfile: indexer/Dockerfile
    environment:
      DATABASE_URL: postgresql://bikegps:${POSTGRES_PASSWORD:-bikegps}@postgres:5432/bikegps
      # Both are documented in .env.example as overridable and neither was
      # passed through, so setting either had no effect at all. Moving
      # OSM_DIR also means changing the volume mount below; WORK_DIR stands
      # alone, and matters more now that all-roads indexing writes a
      # ~470 MB filtered extract into it.
      OSM_DIR: ${OSM_DIR:-/custom_files}
      WORK_DIR: ${WORK_DIR:-/tmp}
      # Off by default: indexing every bikeable way is the difference
      # between a 37-second rebuild and an eight-minute one, and 150 MB
      # against 1.24 GB. Only all-roads coverage needs it.
      INDEX_ROADS: ${INDEX_ROADS:-false}
    volumes:
      # Read-only: this reads the extract Valhalla downloaded and must
      # never write to the tiles volume. Scratch space goes in /tmp.
      - valhalla_tiles:/custom_files:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Only that the container exists - compose cannot tell whether
      # Valhalla has finished downloading the extract, and the indexer
      # reads that file. See docs/data.md: run this after a tile build has
      # completed, never during one.
      valhalla:
        condition: service_started
    restart: "no"

  backend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      VALHALLA_URL: http://valhalla:8002
      CORS_ORIGINS: http://localhost:5173
      TILE_URL_CYCLOSM: ${TILE_URL_CYCLOSM:-}
      DATABASE_URL: postgresql+asyncpg://bikegps:${POSTGRES_PASSWORD:-bikegps}@postgres:5432/bikegps
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:5173}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      WAHOO_CLIENT_ID: ${WAHOO_CLIENT_ID:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      WAHOO_CLIENT_SECRET: ${WAHOO_CLIENT_SECRET:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    ports:
      - "127.0.0.1:17777:17777"
    depends_on:
      valhalla:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      BACKEND_URL: http://backend-dev:17777
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend-dev
    restart: unless-stopped

  backend:
    profiles: ["prod"]
    image: ghcr.io/beaglemoo/moovelo:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    environment:
      VALHALLA_URL: http://valhalla:8002
      TILE_URL_CYCLOSM: ${TILE_URL_CYCLOSM:-}
      DATABASE_URL: postgresql+asyncpg://bikegps:${POSTGRES_PASSWORD:-bikegps}@postgres:5432/bikegps
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:-http://localhost:5173}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      WAHOO_CLIENT_ID: ${WAHOO_CLIENT_ID:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      WAHOO_CLIENT_SECRET: ${WAHOO_CLIENT_SECRET:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
    ports:
      - "${APP_PORT:-17777}:17777"
    depends_on:
      valhalla:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valhalla_tiles:
  frontend_node_modules:
  pgdata:
