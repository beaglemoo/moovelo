<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Moovelo</title>
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- The status strip on an installed app. Kept at the PAGE background so
		     it stays visually separate from the top bar; lib/theme.svelte.ts
		     rewrites it whenever the theme changes, and the guard below sets it
		     for the first paint. -->
		<meta name="theme-color" content="#fdf6e3" />
		<!-- iOS has no install prompt or manifest support; these are the only
		     way an "Add to Home Screen" install picks up the name and icon. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Moovelo" />
		<!-- Keep the application below the iOS status bar. black-translucent
		     extends the interactive viewport underneath the clock and Dynamic
		     Island, which hid the authenticated navigation in Home Screen mode. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<script>
			// FOUC guard: set data-theme before hydration, so the CSS in
			// +layout.svelte never has to repaint from the wrong theme.
			// Mirrors lib/theme.svelte.ts's apply(), but must run synchronously
			// and pre-hydration, so it is plain inline JS with no imports.
			(function () {
				try {
					var mode = localStorage.getItem('moovelo:theme');
					if (mode === 'light' || mode === 'dark') {
						document.documentElement.dataset.theme = mode;
					}
					var dark =
						mode === 'dark' ||
						(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', dark ? '#002b36' : '#fdf6e3');
				} catch (e) {
					/* storage unavailable - fall through to prefers-color-scheme */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
